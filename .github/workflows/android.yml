name: Build signed CliMa APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: android-release
    env:
      CLIMA_ORIGIN: ${{ vars.CLIMA_ORIGIN }}
      CLIMA_KEYSTORE_PASSWORD: ${{ secrets.CLIMA_KEYSTORE_PASSWORD }}
      CLIMA_KEY_ALIAS: ${{ secrets.CLIMA_KEY_ALIAS }}
      CLIMA_KEY_PASSWORD: ${{ secrets.CLIMA_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - name: Restore private build inputs
        env:
          FIREBASE_ANDROID_BASE64: ${{ secrets.FIREBASE_ANDROID_BASE64 }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          python - <<'PY'
          import os,base64,pathlib
          from urllib.parse import urlsplit
          u=urlsplit(os.environ.get('CLIMA_ORIGIN',''))
          assert u.scheme=='https' and u.hostname and not u.username and not u.query and u.path in ('','/'), 'Configure the real CLIMA_ORIGIN'
          for name in ['CLIMA_KEYSTORE_PASSWORD','CLIMA_KEY_ALIAS','CLIMA_KEY_PASSWORD']:
              assert os.environ.get(name), 'Missing signing input: '+name
          for key,path in [('FIREBASE_ANDROID_BASE64','android/app/google-services.json'),('KEYSTORE_BASE64',os.environ['RUNNER_TEMP']+'/clima-release.jks')]:
              value=os.environ.get(key,'')
              assert value, 'Missing private input: '+key
              pathlib.Path(path).write_bytes(base64.b64decode(value,validate=True))
              os.chmod(path,0o600)
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('CLIMA_KEYSTORE='+os.environ['RUNNER_TEMP']+'/clima-release.jks\n')
          PY
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile and lint release
        working-directory: android
        run: gradle --no-daemon -PCLIMA_ORIGIN="$CLIMA_ORIGIN" :app:assembleRelease :app:bundleRelease :app:lintRelease
      - name: Verify APK signature
        run: "$ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose android/app/build/outputs/apk/release/app-release.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: CliMa-signed-apk-and-aab
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/clima-release.jks" android/app/google-services.json
